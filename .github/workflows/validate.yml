name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shacl:
    name: Turtle + SHACL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python load_all.py --shapes

  hermit:
    name: HermiT (OWL 2 DL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt owlready2
      - run: python check_hermit.py
